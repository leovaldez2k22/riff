# Provider canary (plan Q10A): is YouTube Music still answering the way the pinned integration expects?
# Once a day and on request. Never on a pull request or a push. No account and no secret: signed out, it asks
# for one search and one collection page. The stream phase needs the Android solver and is not run here; see
# docs/quality/provider-compatibility.md. A hosted runner is often refused by the provider: that is recorded
# as Blocked and is not a failure. The run fails only on a break seen twice in a row, or when the canary itself
# is at fault. It changes no code, bumps no dependency and publishes nothing.
name: Provider canary

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-canary
  cancel-in-progress: false

# gradle/verification-metadata.xml was recorded on Windows and has no checksum for the artifacts only a Linux
# build downloads (aapt2 for Linux, for one). Until those are added from a reviewed Linux run, a mismatch here is
# reported in the log and does not stop the build. Local builds are strict. See docs/quality/security-review.md.
env:
  GRADLE_OPTS: -Dorg.gradle.dependency.verification=lenient

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0 platform-tools'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: robolectric-

      # Earlier results, so that a break is flagged only when it is seen twice in a row.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/quality/canary
          key: provider-canary-state-${{ github.run_id }}
          restore-keys: provider-canary-state-

      - name: Canary
        run: python3 scripts/quality/provider_canary.py --run-jvm --trigger "${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: artifacts/quality/canary
          key: provider-canary-state-${{ github.run_id }}

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-canary
          path: artifacts/quality/canary/
          retention-days: 30
