# Riff CI: the deterministic pull-request lane of scripts/quality/verify.py (Q16): script tests, static checks,
# JVM and Compose tests, release lint, an unsigned shrunk release with its build identity, the release content
# check, the 40 MiB ceiling and the solver seam. The signing key never comes here: release builds are unsigned.
# The emulator lane is emulator.yml; physical-device, benchmark and live lanes run locally (docs/quality/ci-lanes.md).
name: CI

on:
  push:
    branches: [main, 'fix/**', 'codex/**']
  pull_request:
  workflow_dispatch:

# Read-only token: the build publishes nothing and needs no secret. Actions are pinned to reviewed commits
# (docs/quality/security-review.md); a tag can be moved, a commit cannot.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Dependency verification is strict here as it is locally: gradle/verification-metadata.xml also lists aapt2 for
# Linux and macOS (Q16), the one platform-specific artifact the build resolves. If a hosted run reports an
# artifact without a checksum, add it from a reviewed run; do not turn verification off.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # innertubex classes need Java 21 (class file version 65) in unit tests.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0 platform-tools'

      # Caches Gradle and validates the wrapper; the build uses ./gradlew (Gradle 8.13).
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Robolectric downloads android-all jars into the Maven local repository.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: robolectric-

      # Every required gate of the lane is in lane-summary.json; a gate that did not run is BLOCKED and fails the job.
      - name: Pull-request lane
        run: python3 scripts/quality/verify.py --lane pr --evidence-dir artifacts/quality/lanes/pr

      - name: Lane summary
        if: always()
        run: cat artifacts/quality/lanes/pr/lane-summary.md >> "$GITHUB_STEP_SUMMARY" || true

      # Sanitized summaries and manifests only: no APK, no device data, no signing file.
      - name: Upload quality summaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-summaries
          path: |
            artifacts/quality/lanes/pr/lane-summary.*
            artifacts/quality/**/manifest.json
          retention-days: 14

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
