# Riff CI (plan W7.6): unit and Robolectric UI tests, release lint, an unsigned shrunk release build
# and the APK size budget. The signing key never comes here: release builds are unsigned in CI.
# Device tests (instrumentation on the phone) stay local: scripts/verify-device.ps1, scripts/stress.
name: CI

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:

# Read-only token: the build publishes nothing and needs no secret. Actions are pinned to reviewed commits
# (docs/quality/security-review.md); a tag can be moved, a commit cannot.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# gradle/verification-metadata.xml was recorded on Windows and has no checksum for the artifacts only a Linux
# build downloads (aapt2 for Linux, for one). Until those are added from a reviewed Linux run, a mismatch here is
# reported in the log and does not stop the build. Local builds are strict. See docs/quality/security-review.md.
env:
  GRADLE_OPTS: -Dorg.gradle.dependency.verification=lenient

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # innertubex classes need Java 21 (class file version 65) in unit tests.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0 platform-tools'

      # Caches Gradle and validates the wrapper; the build uses ./gradlew (Gradle 8.13).
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Robolectric downloads android-all jars into the Maven local repository.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: robolectric-

      - name: Unit and UI tests, lint, release build
        run: |
          python3 -m unittest discover -s scripts/quality -p 'test_*.py'
          python3 scripts/quality/collect_results.py --variant release

      - name: APK size budget (40 MiB)
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk)
          bytes=$(stat -c %s "$apk")
          echo "$(basename "$apk"): $((bytes / 1024 / 1024)) MiB"
          unzip -l "$apk" | awk 'NR>3 {n=split($4,p,"/"); k=(p[1]=="lib"?p[1]"/"p[2]:p[1]); if(p[1]~/\.dex$/)k="dex"; s[k]+=$1} END {for(k in s) if(s[k]>100000) printf "%8.1f MB %s\n", s[k]/1e6, k}' | sort -rn
          if [ "$bytes" -gt $((40 * 1024 * 1024)) ]; then echo "::error::Release APK is over the 40 MiB budget"; exit 1; fi

      # Q15: the APK's own manifest and contents against the reviewed lists (backup, cleartext, exported
      # components, permissions, no test or benchmark code, no key file).
      - name: Release content
        run: python3 scripts/quality/check_release_content.py --apk "$(ls app/build/outputs/apk/release/*.apk)" --aapt2 "$ANDROID_HOME/build-tools/36.0.0/aapt2"

      - name: Upload quality manifests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-manifests
          path: artifacts/quality/**/manifest.json
          retention-days: 14

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
